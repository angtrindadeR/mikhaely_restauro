<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mikhaely Aparecida — Conservação, Restauro, Fotogrametria e Fabricação Digital.">
    <title>Mikhaely Aparecida — Conservação & Restauro</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --off-white: #FAF8F5;
            --branco-puro: #FFFFFF;
            --azul-marinho: #162238;
            --azul-profundo: #0E1624;
            --verde-oliva: #556B2F;
            --verde-oliva-hover: #435424;
            --ocre-dourado: #C5A059;
            --terracota: #B85B35;
            --texto-corpo: #333333;
            --cinza-suave: #EAE6DF;
            --ease: cubic-bezier(.22, 1, .36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 90px;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--off-white);
            color: var(--texto-corpo);
            line-height: 1.7;
            overflow-x: hidden;
        }

        body.modal-open {
            overflow: hidden;
        }

        h1, h2, h3, h4, .brand-logo {
            font-family: 'Cinzel', serif;
        }

        ::selection {
            background: var(--ocre-dourado);
            color: var(--azul-marinho);
        }

        /* =========================================================
            HEADER
        ========================================================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 1.25rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--off-white);
            background: rgba(22, 34, 56, 0);
            border-bottom: 1px solid rgba(197, 160, 89, 0);
            transition:
                background .55s ease,
                backdrop-filter .55s ease,
                padding .55s var(--ease),
                border-color .55s ease,
                box-shadow .55s ease;
        }

        header.scrolled {
            padding-top: .78rem;
            padding-bottom: .78rem;
            background: rgba(22, 34, 56, .86);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom-color: rgba(197, 160, 89, .22);
            box-shadow: 0 10px 35px rgba(8, 14, 25, .16);
        }

        .brand-logo {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--off-white);
            line-height: 1.15;
            text-decoration: none;
        }

        .brand-logo span {
            color: var(--ocre-dourado);
            font-size: .68rem;
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            letter-spacing: 1px;
            margin-top: .35rem;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 1.8rem;
        }

        nav a {
            position: relative;
            color: var(--off-white);
            text-decoration: none;
            font-size: .82rem;
            font-weight: 400;
            padding: .45rem 0;
            opacity: .92;
            transition: color .3s ease, opacity .3s ease;
        }

        nav a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 1px;
            background: var(--ocre-dourado);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform .45s var(--ease);
        }

        nav a:hover,
        nav a.active {
            color: var(--ocre-dourado);
            opacity: 1;
        }

        nav a:hover::after,
        nav a.active::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        /* =========================================================
            HERO
        ========================================================= */

        .hero {
            min-height: 100vh;
            position: relative;
            isolation: isolate;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 35%, rgba(197,160,89,.08), transparent 34%),
                var(--azul-marinho);
            color: var(--off-white);
            padding: 9rem 8% 7rem;
            text-align: center;
            border-bottom: 1px solid rgba(197,160,89,.28);
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 8%;
            border: 1px solid rgba(197,160,89,.08);
            pointer-events: none;
            animation: frameReveal 1.8s var(--ease) both;
        }

        .hero::after {
            content: '';
            position: absolute;
            width: 520px;
            height: 520px;
            right: -280px;
            top: 15%;
            border: 1px solid rgba(197,160,89,.08);
            border-radius: 50%;
            box-shadow:
                0 0 0 50px rgba(197,160,89,.025),
                0 0 0 100px rgba(197,160,89,.018);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 980px;
        }

        .hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: .7rem;
            color: var(--ocre-dourado);
            font-size: .67rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 1.4rem;
            opacity: 0;
            transform: translateY(18px);
            animation: heroReveal .9s var(--ease) .05s forwards;
        }

        .hero-eyebrow::before,
        .hero-eyebrow::after {
            content: '';
            width: 28px;
            height: 1px;
            background: var(--ocre-dourado);
            opacity: .65;
        }

        .hero h1 {
            max-width: 1100px;
            margin: 0 auto 1.2rem;
            color: var(--off-white);
            font-size: clamp(2.25rem, 5vw, 4.6rem);
            line-height: 1.05;
            letter-spacing: -.035em;
            font-weight: 600;
            opacity: 0;
            transform: translateY(30px);
            animation: heroReveal 1.05s var(--ease) .15s forwards;
        }

        .tagline {
            color: var(--ocre-dourado);
            font-size: clamp(.95rem, 1.6vw, 1.2rem);
            font-style: italic;
            font-weight: 400;
            margin-bottom: 1.5rem;
            opacity: 0;
            transform: translateY(25px);
            animation: heroReveal .9s var(--ease) .3s forwards;
        }

        .hero-description {
            max-width: 720px;
            margin: 0 auto;
            color: #D1D5DB;
            font-size: .98rem;
            font-weight: 300;
            line-height: 1.85;
            opacity: 0;
            transform: translateY(25px);
            animation: heroReveal .9s var(--ease) .45s forwards;
        }

        .hero-buttons {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: .55rem;
            opacity: 0;
            transform: translateY(25px);
            animation: heroReveal .9s var(--ease) .6s forwards;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .55rem;
            min-height: 48px;
            padding: .78rem 1.65rem;
            border-radius: 3px;
            text-decoration: none;
            font-weight: 600;
            font-size: .82rem;
            letter-spacing: .1px;
            transition:
                transform .45s var(--ease),
                background-color .35s ease,
                color .35s ease,
                border-color .35s ease,
                box-shadow .45s ease;
            cursor: pointer;
        }

        .btn::after {
            content: '↗';
            font-size: .95rem;
            transition: transform .4s var(--ease);
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn:hover::after {
            transform: translate(3px, -3px);
        }

        .btn-primary {
            background: var(--verde-oliva);
            color: white;
            border: 1px solid var(--verde-oliva);
            box-shadow: 0 8px 25px rgba(85,107,47,.18);
        }

        .btn-primary:hover {
            background: var(--verde-oliva-hover);
            border-color: var(--verde-oliva-hover);
            box-shadow: 0 14px 35px rgba(85,107,47,.25);
        }

        .btn-secondary {
            border: 1px solid rgba(197,160,89,.8);
            color: var(--ocre-dourado);
            background: transparent;
        }

        .btn-secondary:hover {
            background: var(--ocre-dourado);
            color: var(--azul-marinho);
            box-shadow: 0 12px 30px rgba(197,160,89,.16);
        }

        /* =========================================================
            GENERAL SECTIONS
        ========================================================= */

        section {
            padding: 6.5rem 8%;
            position: relative;
        }

        .section-inner {
            width: min(1180px, 100%);
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: clamp(1.65rem, 3vw, 2.35rem);
            line-height: 1.2;
            color: var(--azul-marinho);
            margin-bottom: 3rem;
            position: relative;
            letter-spacing: -.025em;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 45px;
            height: 2px;
            background: var(--ocre-dourado);
            margin: .8rem auto 0;
            transform: scaleX(0);
            transform-origin: center;
            transition: transform .8s var(--ease);
        }

        .section-title.visible::after {
            transform: scaleX(1);
        }

        .reveal {
            opacity: 0;
            transform: translateY(35px);
            transition:
                opacity .85s ease,
                transform .9s var(--ease);
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================================================
            SOBRE
        ========================================================= */

        #sobre {
            background: var(--off-white);
        }

        .about-container {
            display: grid;
            grid-template-columns: 300px minmax(0, 650px);
            gap: 5rem;
            align-items: center;
            justify-content: center;
        }

        .monogram-wrap {
            display: flex;
            justify-content: center;
        }

        .monogram-box {
            width: 225px;
            height: 225px;
            border: 2px solid var(--ocre-dourado);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #FFFFFF 48%, #F5F2EA 100%);
            box-shadow: 0 12px 35px rgba(22,34,56,.07);
            position: relative;
            padding: 1.5rem;
            transition:
                transform .8s var(--ease),
                box-shadow .8s ease;
        }

        .monogram-box::before {
            content: '';
            position: absolute;
            inset: 8px;
            border: 1px dashed var(--ocre-dourado);
            border-radius: 50%;
            opacity: .7;
            transition: transform .8s var(--ease);
        }

        .monogram-box:hover {
            transform: translateY(-8px);
            box-shadow: 0 22px 50px rgba(22,34,56,.12);
        }

        .monogram-box:hover::before {
            transform: rotate(8deg);
        }

        .monogram-box .symbol {
            position: relative;
            z-index: 1;
            font-family: 'Cinzel', serif;
            font-size: 3.3rem;
            font-weight: 700;
            color: var(--azul-marinho);
            line-height: 1;
        }

        .monogram-divider {
            position: relative;
            z-index: 1;
            width: 60px;
            height: 10px;
            margin: .4rem 0;
            fill: var(--ocre-dourado);
        }

        .monogram-box .subtext {
            position: relative;
            z-index: 1;
            font-size: .62rem;
            letter-spacing: 2.5px;
            color: var(--verde-oliva);
            text-transform: uppercase;
            font-weight: 600;
            text-align: center;
        }

        .about-text {
            max-width: 650px;
        }

        .about-text p {
            margin-bottom: 1.2rem;
            text-align: left;
            color: #444;
            font-size: .93rem;
        }

        .about-text strong {
            color: var(--azul-marinho);
            font-weight: 700;
        }

        .credentials {
            display: flex;
            gap: .7rem;
            margin-top: 1.7rem;
            flex-wrap: wrap;
        }

        .badge {
            position: relative;
            background: #EFECE6;
            border-left: 3px solid var(--verde-oliva);
            color: var(--azul-marinho);
            padding: .55rem .9rem;
            font-size: .75rem;
            font-weight: 600;
            border-radius: 0 3px 3px 0;
            transition:
                transform .4s var(--ease),
                background .3s ease;
        }

        .badge:hover {
            transform: translateX(4px);
            background: #E8E4DC;
        }

        /* =========================================================
            ÁREAS DE ATUAÇÃO
        ========================================================= */

        #especialidades {
            overflow: hidden;
            background:
                linear-gradient(rgba(250,248,245,.88), rgba(250,248,245,.91)),
                url('https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=1920&q=80');
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.2rem;
        }

        .service-card {
            position: relative;
            overflow: hidden;
            min-height: 245px;
            background: rgba(255,255,255,.91);
            padding: 2rem 1.65rem 1.8rem;
            border: 1px solid rgba(174,169,158,.42);
            border-top: 3px solid var(--verde-oliva);
            box-shadow: 0 8px 25px rgba(22,34,56,.035);
            transition:
                transform .65s var(--ease),
                box-shadow .65s ease,
                border-color .4s ease;
        }

        .service-card::before {
            content: attr(data-number);
            position: absolute;
            right: -8px;
            bottom: -25px;
            font-family: 'Cinzel', serif;
            font-size: 7rem;
            line-height: 1;
            color: rgba(22,34,56,.035);
            pointer-events: none;
            transition: transform .8s var(--ease);
        }

        .service-card::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 3px;
            background: var(--ocre-dourado);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .65s var(--ease);
        }

        .service-card:hover {
            transform: translateY(-9px);
            box-shadow: 0 20px 45px rgba(22,34,56,.11);
            border-color: rgba(197,160,89,.55);
        }

        .service-card:hover::before {
            transform: translate(-5px, -5px);
        }

        .service-card:hover::after {
            transform: scaleX(1);
        }

        .service-card h3 {
            position: relative;
            z-index: 1;
            color: var(--azul-marinho);
            margin-bottom: .8rem;
            font-size: 1.02rem;
            line-height: 1.35;
        }

        .service-card p {
            position: relative;
            z-index: 1;
            color: #4e4e4e;
            font-size: .84rem;
            line-height: 1.8;
        }

        /* =========================================================
            PORTFÓLIO
        ========================================================= */

        #portfolio {
            background: var(--off-white);
        }

        .portfolio-tabs {
            display: flex;
            justify-content: center;
            gap: .55rem;
            margin-bottom: 2.6rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid #DCD7CE;
            color: var(--azul-marinho);
            padding: .55rem 1.1rem;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: .75rem;
            font-weight: 600;
            cursor: pointer;
            transition:
                background .35s ease,
                color .35s ease,
                border-color .35s ease,
                transform .35s var(--ease);
        }

        .tab-btn:hover {
            transform: translateY(-2px);
            border-color: var(--ocre-dourado);
        }

        .tab-btn.active {
            background: var(--verde-oliva);
            color: white;
            border-color: var(--verde-oliva);
            box-shadow: 0 6px 18px rgba(85,107,47,.15);
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2rem;
        }

        .project-card {
            position: relative;
            background: var(--branco-puro);
            border: 1px solid var(--cinza-suave);
            overflow: hidden;
            cursor: pointer;
            transition:
                opacity .45s ease,
                transform .65s var(--ease),
                box-shadow .65s ease,
                border-color .4s ease;
        }

        .project-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 20px 50px rgba(22,34,56,.11);
            border-color: rgba(197,160,89,.65);
        }

        .project-card.hide {
            display: none;
        }

        .project-image-wrap {
            position: relative;
            overflow: hidden;
            height: 340px;
            background: #ECE8E1;
        }

        .project-image-wrap::after {
            content: 'VER PROJETO ↗';
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            padding: .5rem .7rem;
            background: rgba(14,22,36,.86);
            color: var(--off-white);
            font-size: .62rem;
            letter-spacing: 1.5px;
            opacity: 0;
            transform: translateY(8px);
            transition:
                opacity .45s ease,
                transform .55s var(--ease);
        }

        .project-card:hover .project-image-wrap::after {
            opacity: 1;
            transform: translateY(0);
        }

        .card-img-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 1s var(--ease);
        }

        .project-card:hover .card-img-cover {
            transform: scale(1.045);
        }

        .project-info {
            padding: 1.5rem 1.6rem 1.6rem;
        }

        .project-tag {
            font-size: .66rem;
            color: var(--terracota);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .project-info h3 {
            color: var(--azul-marinho);
            margin: .35rem 0 .55rem;
            font-size: 1.08rem;
        }

        .project-info p {
            font-size: .82rem;
            color: #666;
            margin-bottom: 1rem;
            line-height: 1.75;
        }

        .card-action-link {
            font-size: .72rem;
            font-weight: 700;
            color: var(--verde-oliva);
            transition: color .3s ease;
        }

        .project-card:hover .card-action-link {
            color: var(--terracota);
        }

        /* =========================================================
            MODAL
        ========================================================= */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10,17,28,.78);
            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            opacity: 0;
            visibility: hidden;
            transition:
                opacity .45s ease,
                visibility .45s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-container {
            background: var(--off-white);
            max-width: 900px;
            width: 100%;
            max-height: 91vh;
            overflow-y: auto;
            position: relative;
            border: 1px solid var(--ocre-dourado);
            box-shadow: 0 35px 100px rgba(0,0,0,.3);
            transform: translateY(30px) scale(.97);
            opacity: 0;
            transition:
                transform .65s var(--ease),
                opacity .45s ease;
        }

        .modal-overlay.active .modal-container {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .modal-close-btn {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            background: rgba(255,255,255,.94);
            border: 1px solid var(--cinza-suave);
            color: var(--azul-marinho);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: 500;
            cursor: pointer;
            z-index: 10;
            transition:
                transform .4s var(--ease),
                background .3s ease,
                color .3s ease;
        }

        .modal-close-btn:hover {
            transform: rotate(90deg);
            background: var(--azul-marinho);
            color: white;
        }

        .modal-content {
            padding: 2.7rem 2.3rem 2.2rem;
        }

        .modal-header {
            margin-bottom: 1.7rem;
            border-bottom: 1px solid var(--cinza-suave);
            padding-bottom: 1.1rem;
        }

        .modal-tag {
            color: var(--terracota);
            font-size: .7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-title {
            color: var(--azul-marinho);
            font-size: clamp(1.4rem, 3vw, 2rem);
            line-height: 1.25;
            margin-top: .35rem;
        }

        .gallery-main {
            height: 430px;
            background: #ECE8E1;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--cinza-suave);
            margin-bottom: .8rem;
        }

        .gallery-main img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #0E1624;
            opacity: 1;
            transform: scale(1);
            transition:
                opacity .3s ease,
                transform .5s var(--ease);
        }

        .gallery-main img.changing {
            opacity: 0;
            transform: scale(.97);
        }

        .gallery-main-label {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(22,34,56,.88);
            color: var(--off-white);
            font-size: .65rem;
            padding: .35rem .7rem;
            border-radius: 2px;
            font-weight: 600;
            z-index: 2;
        }

        .gallery-thumbs {
            display: flex;
            gap: .65rem;
            margin-bottom: 2rem;
            overflow-x: auto;
            padding: .15rem .1rem .55rem;
            scrollbar-width: thin;
        }

        .thumb-item {
            flex: 0 0 90px;
            height: 65px;
            background: #E2DDD4;
            border: 2px solid transparent;
            cursor: pointer;
            overflow: hidden;
            transition:
                border-color .3s ease,
                transform .4s var(--ease),
                opacity .3s ease;
            opacity: .72;
        }

        .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb-item:hover {
            transform: translateY(-2px);
            opacity: 1;
        }

        .thumb-item.active {
            border-color: var(--verde-oliva);
            transform: translateY(-2px);
            opacity: 1;
        }

        .modal-body-grid {
            display: grid;
